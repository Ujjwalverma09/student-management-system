<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="container">

        <h1>Student Management System</h1>

        <form id="studentForm">

            <input
                type="text"
                id="name"
                placeholder="Enter Name"
                required
            >

            <input
                type="email"
                id="email"
                placeholder="Enter Email"
                required
            >

            <input
                type="text"
                id="course"
                placeholder="Enter Course"
                required
            >

            <input
                type="number"
                id="age"
                placeholder="Enter Age"
                required
            >

            <input
                type="text"
                id="mobile"
                placeholder="Enter Mobile"
                required
            >

            <input
                type="text"
                id="address"
                placeholder="Enter Address"
                required
            >

            <button type="submit">
                Add Student
            </button>

        </form>

        <hr>

        <table>

            <thead>

                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Course</th>
                    <th>Age</th>
                    <th>Mobile</th>
                    <th>Address</th>
                    <th>Action</th>
                </tr>

            </thead>

            <tbody id="studentTable">

            </tbody>

        </table>

    </div>

<script src="js/app.js"></script>

</body>
</html>
